services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 4000
      KAFKA_OPTS: -Djute.maxbuffer=50000000
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OPTS: -Djute.maxbuffer=50000000
      KAFKA_CREATE_TOPICS: "aggregated-pulses"
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  
  postgres:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=cloudgauge
      - SCHEMA=pulsereceiver
      - ANON=web_anon
      - AUTHENTICATOR=authenticator
    volumes:            
      - ./infra/postgres/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user"]
      interval: 5s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
  app:
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: golang-app
    container_name: golang_app
    ports:
      - "8085:8085"
    volumes:
      - ./config:/config:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:172.17.0.1"


volumes:
  postgres_data:
